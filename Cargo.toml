[package]
name = "pigeon"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.39", features = ["derive"] }
crossterm = "0.29.0"
dirs-next = "2.0.0"
imap = "2.4.1"
imap-proto = "0.16.5"
keyring = { version = "3.6.2", features = ["linux-native", "windows-native", "apple-native"] }
native-tls = "0.2.14"
oauth2 = "5.0.0"
ratatui = { version = "0.29.0", features = ["all-widgets"] }
reqwest = "0.12.20"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tiny_http = "0.12.0"
tokio = { version = "1.45.1", features = ["full"] }
toml = "0.8.23"
